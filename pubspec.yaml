name: cg_net_mobile
description: CG-NET — customer-facing ISP mobile app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  easy_localization: ^3.0.7
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  shimmer: ^3.0.0
  package_info_plus: ^8.1.1
  intl: ^0.20.2
  flutter_lucide: ^1.42.0
  google_fonts: ^8.1.0
  url_launcher: ^6.3.2
  mobile_scanner: ^6.0.11
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/branding/app_icon.png
  adaptive_icon_background: "#0100CA"
  adaptive_icon_foreground: assets/images/branding/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
    - assets/translations/
    - assets/images/
    - assets/images/packages/
    - assets/images/banners/
    - assets/images/services/
    - assets/images/launch/
    - assets/images/branding/
    - assets/images/flags/
    - assets/images/quick_actions/
    - assets/images/inbox/
    - assets/images/dialogs/
    - assets/images/auth/
